[platformio]
default_envs = esp32c3

; Settings shared across all environments
[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:compress_web.py
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; BambuLab sends large MQTT records over TLS
    -DMBEDTLS_SSL_IN_CONTENT_LEN=16384
    -DMBEDTLS_SSL_OUT_CONTENT_LEN=4096
lib_deps =
    bblanchon/ArduinoJson
    adafruit/Adafruit NeoPixel@^1.10.6
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    knolleary/PubSubClient@^2.8

; USB flashing — use this for the first flash
[env:esp32c3]

; Wireless flashing once the device is on the network
[env:esp32c3_ota]
upload_protocol = espota
upload_port = ringlight.local

; Web installer release: includes the Improv Wi-Fi first-boot wizard
[env:esp32c3_installer]
build_flags =
    ${env.build_flags}
    -D IMPROV_ENABLED

lib_deps =
    ${env.lib_deps}
    https://github.com/jnthas/Improv-WiFi-Library.git
